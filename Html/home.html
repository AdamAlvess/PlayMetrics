<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏋️ Données PlayMetrics en direct</title>
  <link rel="stylesheet" href="/style_home.css">
  <link rel="stylesheet" href="/style_nav.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li id="menuButton">&#9776;</li>
        <div id="popup" class="popup">
          <a href="home.html">Accueil</a>
          <a href="about.html">À propos</a>
          <a href="contact.html">Contacts</a>
          <a href="/logout">Déconnexion</a>
        </div>
      </ul>
      <p id="usernameDisplay" style="text-align: right; padding-right: 20px;">👤</p>
    </nav>
    <h1>Bienvenue sur PlayMetrics</h1>
  </header>

  <main>
    <h2>📊 Suivi en temps réel - PlayMetrics</h2>
    <div class="metric-box">
      <div>📅 Séance</div>
      <div id="seance-number" class="metric-value">--</div>
    </div>    
    <div class="metrics-container">
      <div class="metric-box">
        <div>🏋️ Squat</div>
        <div id="squat" class="metric-value">--</div>
      </div>

      <div class="metric-box">
        <div>💪 Tractions</div>
        <div id="tractions" class="metric-value">--</div>
      </div>

      <div class="metric-box">
        <div>🙌 Pompes</div>
        <div id="pompes" class="metric-value">--</div>
      </div>

      <div class="metric-box">
        <div>💥 Chutes</div>
        <div id="chutes" class="metric-value">--</div>
      </div>
    </div>
    <div style="text-align: center; margin-top: 20px;">
      <a href="historique.html">
        <button style="padding: 10px 20px; font-size: 16px;">📚 Historique des séances</button>
      </a>
    </div>
    
  </main>

  <footer>
    <p>&copy; 2024 Notre Entreprise. Tous droits réservés.</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <script>
    fetch("/user-info")
      .then(response => response.json())
      .then(data => {
        if (!data.loggedIn) {
          window.location.href = "/login.html"; // Redirige si pas connecté
        } else {
          document.getElementById("usernameDisplay").textContent = data.username;
        }
      });
  </script>

  <script src="/script.js"></script>
</body>
</html>
