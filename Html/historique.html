<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Historique des séances</title>
  <link rel="stylesheet" href="/style_historique.css">
  <link rel="stylesheet" href="/style_nav.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <nav>
        <ul>
          <li id="menuButton">&#9776;</li>
          <div id="popup" class="popup">
            <a href="home.html">Accueil</a>
            <a href="about.html">À propos</a>
            <a href="contact.html">Contacts</a>
            <a href="/logout">Déconnexion</a>
          </div>
        </ul>
        <p id="usernameDisplay" style="text-align: right; padding-right: 20px;">👤</p>
    </nav>
      
    <h1>📚 Historique des séances</h1>
    <h3 id="username-display"></h3>
    
</header>
<main>
    <section id="objectifs">
      <h2>🎯 Mes Objectifs</h2>
      <form id="objectif-form">
        <label>Tractions : <input type="number" id="obj-tractions" min="0" /></label>
        <label>Pompes : <input type="number" id="obj-pompes" min="0" /></label>
        <label>Chutes : <input type="number" id="obj-chutes" min="0" /></label>
        <label>Squat : <input type="number" id="obj-squat" min="0" /></label>
        <button type="submit">💾 Enregistrer</button>
      </form>
    </section>
  
    <div id="historique-container" style="margin-top: 20px;"></div>
  
    <section id="charts" style="margin-top: 40px;">
      <h2>📊 Évolution des performances</h2>
      <h3>Graphiques des tractions</h3>
      <canvas id="chart-tractions"></canvas>
      <h3>Graphiques des pompes</h3>
      <canvas id="chart-pompes"></canvas>
      <h3>Graphiques des squats</h3>
      <canvas id="chart-squat"></canvas>
      <h3>Graphiques des chutes</h3>
      <canvas id="chart-chutes"></canvas>

    </section>
  </main>
  

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  
  <script src="/historique.js"></script>
</body>
</html>
